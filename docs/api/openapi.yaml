openapi: 3.1.0
info:
  title: MeetFlow AI Backend API
  version: 2.0.0
  description: >
    Production-quality meeting intelligence engine API for MeetFlow AI.
    Single-admin, project-isolated meeting-to-execution APIs backed by Neon PostgreSQL.
    All meeting-data routes require an active admin cookie session, including share-link views. Only health and authentication entry points are unauthenticated. All mutations require x-meetflow-request: 1 and an allowed browser Origin. There are no invitations or role-management features.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server (v1)
  - url: http://localhost:4000/api
    description: Local Development Server (Root Namespace)

security:
  - cookieAuth: []

paths:
  /health:
    get:
      security: []
      summary: API & Database Health Check
      description: Returns real-time operational status and database connection health.
      responses:
        "200":
          description: Operational health status.
          content:
            application/json:
              example:
                status: ok
                uptime: 142.5
                timestamp: "2026-11-02T02:00:00.000Z"
                environment: development
                version: v1
                services:
                  api: operational
                  database: connected

  /users/me:
    get:
      summary: Get Current User Profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User profile.
    patch:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Update Personal Profile
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Profile updated.

  /workspaces/current:
    get:
      summary: Get Current Workspace
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspace details and user membership role.
    patch:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Update Current Workspace
      description: Requires OWNER or ADMIN role.
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                organizationName:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Workspace updated.
        "403":
          description: Forbidden (insufficient role).

  /meetings:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Create Meeting & Optional Asynchronous Ingestion
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt, projectId]
              properties:
                projectId: { type: string, format: uuid }
                companyId: { type: string, format: uuid }
                title: { type: string }
                description: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                timezone: { type: string }
                meetingStatus:
                  { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED] }
                sourceType:
                  {
                    type: string,
                    enum:
                      [
                        MANUAL,
                        TRANSCRIPT_UPLOAD,
                        AUDIO_UPLOAD,
                        VIDEO_UPLOAD,
                        CALENDAR,
                      ],
                  }
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                      role: { type: string }
                transcript:
                  type: object
                  properties:
                    rawText: { type: string }
                    sourceFilename: { type: string }
                    sourceFormat: { type: string, enum: [txt, srt, vtt] }
      responses:
        "201":
          description: Meeting is saved. With a transcript, queueStatus is QUEUED on dispatch or REDIS_UNAVAILABLE on failure; dispatch failure returns processingStatus FAILED (not a perpetually queued meeting).
    get:
      summary: List Workspace Meetings
      security:
        - cookieAuth: []
      parameters:
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: companyId, schema: { type: string, format: uuid } }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: processingStatus
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: viewStatus
          schema:
            {
              type: string,
              enum: [ready, processing, scheduled, failed, cancelled],
            }
          description: Dashboard lifecycle filter. Cancellation takes precedence over processing state.
        - in: query
          name: platform
          schema: { type: string, enum: [zoom, meet, teams, upload] }
          description: Matches the dashboard platform mapping. Unsupported provider origins return an empty list.
        - in: query
          name: sort
          schema:
            {
              type: string,
              enum: [newest, oldest, longest, created],
              default: newest,
            }
          description: Newest/created order by creation time; oldest by start time; longest by duration. All orders have a deterministic ID tie-breaker.
      responses:
        "200":
          description: Paginated list of workspace meetings with summary previews and counts.

  /meetings/overview:
    get:
      summary: Get Consolidated Overview Analytics
      security:
        - cookieAuth: []
      parameters:
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: companyId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Aggregated real workspace KPI metrics, recent meetings with actionItemCount, and open attention tasks. Empty workspaces return zero counts and empty lists.

  /meetings/{id}:
    get:
      summary: Get Meeting Details
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Meeting details with participants, transcript metadata, summary, segments, and action items.
    patch:
      summary: Update Meeting Metadata
      description: Updates Neon metadata atomically. Omitted participants are retained; an explicit array replaces participants, including an empty array to remove all. Names are trimmed and must be unique case-insensitively.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 2000 }
                startAt: { type: string, format: date-time }
                endAt: { type: [string, "null"], format: date-time }
                timezone: { type: string }
                meetingStatus:
                  { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED] }
                participants:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, minLength: 1, maxLength: 100 }
                      email: { type: [string, "null"], format: email }
                      role: { type: [string, "null"] }
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated meeting record.
    delete:
      summary: Delete Meeting
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Meeting deleted successfully.

  /meetings/{id}/transcript:
    post:
      summary: Upload Transcript to Existing Meeting
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transcript saved. queueStatus is QUEUED or REDIS_UNAVAILABLE; a dispatch failure marks the persisted meeting and job FAILED.
    get:
      summary: Get Transcript and Segments
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw transcript and ordered turns.

  /meetings/{id}/processing:
    get:
      summary: Poll Processing Status & Progress
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Live processingStatus, stage, progress (0-100), attempts, errorCode, startedAt and completedAt. READY has progress 100. FAILED contains an actionable errorCode string. Retry attempts remain QUEUED until running; missing workers or orphaned queue jobs are reconciled by the API watchdog.

  /meetings/{id}/reprocess:
    post:
      summary: Re-enqueue Meeting Processing
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Returns queueStatus (QUEUED or REDIS_UNAVAILABLE) and processingStatus (QUEUED or FAILED). Completed and failed retained queue jobs are replaced; an existing active job is not duplicated or reset.

  /action-items:
    get:
      summary: List Workspace Action Items
      security:
        - cookieAuth: []
      parameters:
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: companyId, schema: { type: string, format: uuid } }
        - in: query
          name: meetingId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [TODO, IN_PROGRESS, BLOCKED, DONE] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Workspace action items list.
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Create Manual Action Item
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                meetingId: { type: string }
                projectId:
                  {
                    type: string,
                    format: uuid,
                    description: Required for manual tasks without a source meeting.,
                  }
                priority:
                  { type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM }
                assigneeName: { type: string }
                dueDate: { type: string, format: date-time }
                status:
                  { type: string, enum: [TODO, IN_PROGRESS, BLOCKED, DONE] }
      responses:
        "201":
          description: Action item created.

  /action-items/{id}:
    patch:
      summary: Update Action Item
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action item updated.
    delete:
      summary: Delete Action Item
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action item deleted.

  /ask:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Ask about real workspace meeting content
      description: Retrieves bounded workspace sources and calls the environment-configured OpenAI model. Citations reference stored summaries, segments or action items. Maximum 20 questions per user per minute.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                projectId:
                  {
                    type: string,
                    format: uuid,
                    description: Required unless meetingId supplies the project.,
                  }
                question: { type: string, minLength: 1, maxLength: 2000 }
                meetingId: { type: string, format: uuid }
                history:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 5000 }
      responses:
        "200":
          {
            description: Success envelope containing answer,
            citations and retrieval scope; no-content answers are explicit.,
          }
        "404":
          {
            description: Requested meeting is outside the current workspace or does not exist.,
          }
        "429": { description: Question rate limit exceeded. }
        "502":
          {
            description: Invalid provider response; no fabricated answer is substituted.,
          }

  /meetings/media:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Upload private audio or video and enqueue transcription
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  {
                    type: string,
                    format: binary,
                    description: Supported audio/video file up to 512 MiB.,
                  }
                metadata:
                  {
                    type: string,
                    description: JSON-encoded Create Meeting metadata with required projectId/title/startAt and optional companyId/participants/timezone/description.,
                  }
      responses:
        "201":
          {
            description: Saved meeting with queue outcome. Failed Redis dispatch persists FAILED for retry.,
          }
        "400": { description: Invalid file type or metadata. }
        "413": { description: Upload exceeds the maximum size. }
        "429":
          { description: Upload limit of five per user per minute exceeded. }

  /meetings/{id}/media:
    get:
      summary: Stream a workspace meeting's private recording
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          {
            description: Private media bytes; disk storage keys are never exposed.,
          }
        "206": { description: Requested media byte range. }
        "404": { description: Recording or workspace meeting not found. }

  /integrations/calendar:
    get:
      summary: Get current user's Google Calendar connection status
      security:
        - cookieAuth: []
      responses:
        "200":
          {
            description: configured,
            connected,
            lastSyncedAt,
            syncing and safe error; no OAuth tokens.,
          }

  /integrations/calendar/authorize:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Start Google Calendar read-only OAuth consent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          {
            description: Consent URL; also sets a signed ten-minute HttpOnly state/PKCE cookie. Requires configured Google credentials and encryption key.,
          }

  /integrations/calendar/callback:
    get:
      summary: Complete Google OAuth using signed state cookie and PKCE
      description: Does not require the access-token cookie. Verifies state, signed cookie expiry/audience, and current workspace membership before storing encrypted tokens.
      security:
        - cookieAuth: []
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        "302":
          {
            description: Redirect to configured frontend Settings with connected,
            denied or error result.,
          }

  /integrations/calendar/sync:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Import primary Google Calendar events into Neon
      description: Initial window is one year before/after today; subsequent syncs use an incremental cursor. Expired cursors trigger a full refresh. Cancellations retain meeting notes. Concurrent sync is guarded by a lease.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: Sync outcome or already-running status. }
        "404": { description: Connect Google Calendar first. }

  /integrations/calendar/disconnect:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Revoke Google authorization and remove stored connection
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          { description: Disconnected; imported meeting content is preserved. }
        "404": { description: No connection exists. }

  /meetings/{id}/highlights:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: List persisted meeting highlights
      security:
        - cookieAuth: []
      responses:
        "200":
          {
            description: Active highlight UUIDs,
            label,
            quote,
            tag,
            startTime and hasTimestamp.,
          }
        "404": { description: Meeting unavailable in the current workspace. }
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Create a persisted meeting highlight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 255 }
                quote: { type: string, maxLength: 30000 }
                tag: { type: string, minLength: 1, maxLength: 100 }
                startTime:
                  { type: [number, "null"], minimum: 0, maximum: 10000000 }
      responses:
        "201": { description: Persisted highlight. }

  /meetings/{id}/highlights/{highlightId}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: highlightId,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Update supplied highlight fields within the current workspace
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1, maxLength: 255 }
                quote: { type: string, maxLength: 30000 }
                tag: { type: string, minLength: 1, maxLength: 100 }
                startTime:
                  { type: [number, "null"], minimum: 0, maximum: 10000000 }
      responses:
        "200": { description: Updated persisted highlight. }
        "404": { description: Highlight or workspace meeting not found. }
    delete:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Soft-delete a highlight, retaining its processing tombstone
      security:
        - cookieAuth: []
      responses:
        "200": { description: Idempotent deleted outcome. }

  /meetings/{id}/sharing:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Read workspace-authorized sharing management state
      security:
        - cookieAuth: []
      responses:
        "200":
          {
            description: Null or capability token,
            enabled flag and section permissions.,
          }
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Enable, disable, update, regenerate or revoke a public capability
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    enum: [enable, disable, regenerate, revoke, update],
                  }
                permissions:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      allowSummary,
                      allowHighlights,
                      allowActions,
                      allowTranscript,
                    ]
                  properties:
                    allowSummary: { type: boolean, default: true }
                    allowHighlights: { type: boolean, default: true }
                    allowActions: { type: boolean, default: true }
                    allowTranscript: { type: boolean, default: false }
      responses:
        "200":
          {
            description: Updated management state. Regenerate/revoke atomically invalidate old links.,
          }

  /public/meetings/{token}:
    get:
      summary: Read a shared meeting with an active admin session and enabled capability
      security:
        - cookieAuth: []
      parameters:
        - {
            in: path,
            name: token,
            required: true,
            schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" },
          }
      responses:
        "200":
          {
            description: Title/startAt and only permitted summary,
            highlights,
            actionItems and segments. Excludes workspace data,
            private IDs,
            member emails and media URLs. No-store/noindex headers.,
          }
        "404":
          { description: Invalid, expired, disabled or revoked capability. }
        "429": { description: Share-view rate limit exceeded. }

  /meetings/{id}/summaries/{type}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: type,
          required: true,
          schema:
            {
              type: string,
              enum:
                [general, executive, engineering, product, sales, interview],
            },
        }
    get:
      summary: Read a persisted summary type and generation state
      security:
        - cookieAuth: []
      responses:
        "200":
          {
            description: status NOT_GENERATED/QUEUED/RUNNING/READY/FAILED,
            content and safe error.,
          }
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Enqueue missing summary generation without duplicating existing work
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                retry: { type: boolean, default: false }
      responses:
        "200":
          {
            description: Cached READY content or persisted queue/failure state. General reuses the base summary.,
          }
        "409":
          { description: Process this meeting before generating a summary. }

  /auth/status:
    get:
      summary: Check whether initial admin registration is open
      security: []
      responses:
        "200":
          description: Success envelope containing registrationOpen; no identity details.
  /auth/register:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Register the initial single admin and create a session
      description: Serialized initial setup; initializes an unconfigured migration placeholder in place. Additional registrations are refused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                password:
                  {
                    type: string,
                    minLength: 8,
                    description: Requires a letter and number; maximum 72 UTF-8 bytes.,
                  }
                workspaceName: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "201":
          {
            description: Admin/workspace metadata in a success envelope; HTTP-only access and refresh cookies set.,
          }
        "400": { description: Invalid input. }
        "403":
          { description: REGISTRATION_CLOSED or untrusted mutation request. }
        "429": { description: Too many registration attempts. }
  /auth/login:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Sign in as the configured instance admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          {
            description: Admin/workspace metadata in a success envelope; HTTP-only access and refresh cookies set.,
          }
        "400": { description: Invalid input. }
        "401":
          {
            description: INVALID_CREDENTIALS; other historical accounts cannot sign in.,
          }
        "403": { description: Untrusted mutation request. }
        "429": { description: Too many login attempts. }
  /auth/refresh:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Rotate the refresh cookie and renew the access cookie
      description: Requires the opaque HTTP-only refresh cookie. Rotation preserves the session ID and original absolute expiry, and rejects reuse. Tokens in request bodies are not accepted.
      security:
        - refreshCookieAuth: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          {
            description: Session refreshed; cookies replaced; no tokens in JSON.,
          }
        "401":
          { description: Missing, expired, revoked or reused refresh token. }
        "429": { description: Too many refresh requests. }
  /auth/logout:
    post:
      parameters:
        - $ref: "#/components/parameters/TrustedMutation"
      summary: Revoke the current session and clear both auth cookies
      description: Idempotent without a session; also works with an expired access cookie. A transient revocation failure preserves cookies for retry.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          {
            description: Logged out; previously issued access tokens for this session can no longer authorize API requests.,
          }
        "403": { description: Untrusted mutation request. }
        "500": { description: Revocation could not be completed; retry logout. }
