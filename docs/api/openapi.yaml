components:
  parameters:
    TrustedMutation:
      in: header
      name: x-meetflow-request
      required: true
      schema: { type: string, enum: ["1"] }
      description: Required on every mutation for browser CSRF protection. Browser Origin must also be explicitly allowed.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: meetflow_access_token
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: meetflow_refresh_token

  schemas:
    CompanyInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
    CompanyPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, companyId]
      properties:
        companyId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
        status:
          { type: string, enum: [ACTIVE, PAUSED, ARCHIVED], default: ACTIVE }
    ProjectPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
        status: { type: string, enum: [ACTIVE, PAUSED, ARCHIVED] }
