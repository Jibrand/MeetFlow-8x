openapi: 3.1.0
info:
  title: MeetFlow AI Backend API
  version: 1.0.0
  description: >
    Production-quality meeting intelligence engine API for MeetFlow AI.
    Handles JWT authentication via HTTP-only cookies, workspace tenancy,
    user profile management, and onboarding persistence backed by Neon PostgreSQL.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server (v1)
  - url: http://localhost:4000/api
    description: Local Development Server (Root Namespace)

paths:
  /health:
    get:
      summary: API & Database Health Check
      description: Returns real-time operational status and database connection health.
      responses:
        '200':
          description: Operational health status.
          content:
            application/json:
              example:
                status: ok
                uptime: 142.5
                timestamp: '2026-11-02T02:00:00.000Z'
                environment: development
                version: v1
                services:
                  api: operational
                  database: connected

  /auth/register:
    post:
      summary: Register User & Workspace
      description: Validates input, hashes password, transactionally provisions user and workspace, and sets HTTP-only cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Sarah Connor
                email:
                  type: string
                  format: email
                  example: sarah@skynet.ai
                password:
                  type: string
                  format: password
                  example: Secret123!
                workspaceName:
                  type: string
                  example: Tech Resistance
      responses:
        '201':
          description: User and workspace created. Auth cookies set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: meetflow_access_token and meetflow_refresh_token HTTP-only cookies.
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    id: 'u-123'
                    name: Sarah Connor
                    email: sarah@skynet.ai
                    avatarUrl: null
                    role: MEMBER
                  workspace:
                    id: 'ws-123'
                    name: Tech Resistance
                    slug: tech-resistance-a1b2
                    role: OWNER
                  onboarding:
                    completed: false
                    currentStep: 1
                meta:
                  requestId: 'req-abc-123'
                  timestamp: '2026-11-02T02:00:00.000Z'
                  version: v1
        '400':
          description: Validation error.
        '409':
          description: Email already registered.

  /auth/login:
    post:
      summary: Sign In
      description: Authenticates user credentials, sets HTTP-only access and refresh cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: sarah@skynet.ai
                password:
                  type: string
                  format: password
                  example: Secret123!
      responses:
        '200':
          description: Authentication successful.
        '401':
          description: Invalid email or password.

  /auth/refresh:
    post:
      summary: Rotate Refresh Token & Issue Access Token
      description: Reads refresh token from HTTP-only cookie, rotates session token, and issues a new access token.
      responses:
        '200':
          description: Tokens refreshed and cookies updated.
        '401':
          description: Invalid or expired refresh token.

  /auth/logout:
    post:
      summary: Sign Out
      description: Revokes active refresh session in database and clears authentication cookies.
      responses:
        '200':
          description: Successfully signed out.

  /auth/me:
    get:
      summary: Get Current Authenticated User & Workspace
      description: Returns active user profile, workspace role, and onboarding progress.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: User session details.
        '401':
          description: Authentication required.

  /auth/forgot-password:
    post:
      summary: Initiate Password Reset
      description: Generates a secure one-time reset token with 1-hour expiration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic confirmation response.

  /auth/reset-password:
    post:
      summary: Complete Password Reset
      description: Validates one-time token, updates password hash, and invalidates all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: Invalid or expired reset token.

  /users/me:
    get:
      summary: Get Current User Profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile.
    patch:
      summary: Update Personal Profile
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Profile updated.

  /workspaces/current:
    get:
      summary: Get Current Workspace
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Workspace details and user membership role.
    patch:
      summary: Update Current Workspace
      description: Requires OWNER or ADMIN role.
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                organizationName:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Workspace updated.
        '403':
          description: Forbidden (insufficient role).

  /onboarding:
    get:
      summary: Get Onboarding State
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Onboarding progress and persisted selections.
    patch:
      summary: Save Onboarding Selections
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                professionalRole:
                  type: string
                primaryUseCases:
                  type: array
                  items:
                    type: string
                currentStep:
                  type: integer
      responses:
        '200':
          description: Selections saved.

  /onboarding/workspace:
    post:
      summary: Provision / Update Workspace during Onboarding
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceName]
              properties:
                workspaceName:
                  type: string
                orgName:
                  type: string
      responses:
        '200':
          description: Workspace configured and step advanced.

  /onboarding/complete:
    post:
      summary: Mark Onboarding Completed
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Onboarding marked completed.

  /meetings:
    post:
      summary: Create Meeting & Optional Asynchronous Ingestion
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt]
              properties:
                title: { type: string }
                description: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                timezone: { type: string }
                meetingStatus: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED] }
                sourceType: { type: string, enum: [MANUAL, TRANSCRIPT_UPLOAD, AUDIO_UPLOAD, VIDEO_UPLOAD, CALENDAR] }
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                      role: { type: string }
                transcript:
                  type: object
                  properties:
                    rawText: { type: string }
                    sourceFilename: { type: string }
                    sourceFormat: { type: string, enum: [txt, srt, vtt] }
      responses:
        '201':
          description: Meeting is saved. With a transcript, queueStatus is QUEUED on dispatch or REDIS_UNAVAILABLE on failure; dispatch failure returns processingStatus FAILED (not a perpetually queued meeting).
    get:
      summary: List Workspace Meetings
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: processingStatus
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated list of workspace meetings with summary previews and counts.

  /meetings/overview:
    get:
      summary: Get Consolidated Overview Analytics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Aggregated real workspace KPI metrics, recent meetings with actionItemCount, and open attention tasks. Empty workspaces return zero counts and empty lists.

  /meetings/{id}:
    get:
      summary: Get Meeting Details
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Meeting details with participants, transcript metadata, summary, segments, and action items.
    patch:
      summary: Update Meeting Metadata
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated meeting record.
    delete:
      summary: Delete Meeting
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Meeting deleted successfully.

  /meetings/{id}/transcript:
    post:
      summary: Upload Transcript to Existing Meeting
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Transcript saved. queueStatus is QUEUED or REDIS_UNAVAILABLE; a dispatch failure marks the persisted meeting and job FAILED.
    get:
      summary: Get Transcript and Segments
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw transcript and ordered turns.

  /meetings/{id}/processing:
    get:
      summary: Poll Processing Status & Progress
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Live processingStatus, stage, progress (0-100), attempts, errorCode, startedAt and completedAt. READY has progress 100. FAILED contains an actionable errorCode string. Retry attempts remain QUEUED until running; missing workers or orphaned queue jobs are reconciled by the API watchdog.

  /meetings/{id}/reprocess:
    post:
      summary: Re-enqueue Meeting Processing
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Returns queueStatus (QUEUED or REDIS_UNAVAILABLE) and processingStatus (QUEUED or FAILED). Completed and failed retained queue jobs are replaced; an existing active job is not duplicated or reset.

  /action-items:
    get:
      summary: List Workspace Action Items
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: meetingId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Workspace action items list.
    post:
      summary: Create Manual Action Item
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                meetingId: { type: string }
                assigneeName: { type: string }
                dueDate: { type: string, format: date-time }
                status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
      responses:
        '201':
          description: Action item created.

  /action-items/{id}:
    patch:
      summary: Update Action Item
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Action item updated.
    delete:
      summary: Delete Action Item
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Action item deleted.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: meetflow_access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
